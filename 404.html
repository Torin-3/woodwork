<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — TEMDesign</title>
<meta name="description" content="That page could not be found. Browse the full gallery of hand-turned wooden bowls, homeware and jewellery by TEMDesign.">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#F0F0EE">
<link rel="icon" type="image/png" sizes="32x32" href="/woodwork/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/woodwork/logo/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/woodwork/logo/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/woodwork/logo/favicon-180.png">
<style>
  /* Same tokens as index.html, inlined — a 404 must not depend on anything else loading.
     Absolute /woodwork/ paths: GitHub Pages serves this file for ANY missing path.
     No nav (Torin, 18 Sept): one centred column — the mark, the headline, the line, the two links. */
  :root { --ground: #F0F0EE; --ink: #0F0F0F; --lichen: #C6E400; --xanth: #F28C00; --pad: 4vw;
          --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-weight: 500; line-height: 1.4;
         -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100svh;
         display: grid; place-items: center; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  main { width: 100%; padding: 8vh var(--pad); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo { display: block; margin-bottom: 6vh; }
  .logo img { display: block; width: clamp(88px, 11vw, 128px); height: auto; }
  h1 { font-weight: 700; font-size: clamp(2.6rem, 8.5vw, 8.5rem); line-height: .85; letter-spacing: -.045em; text-transform: uppercase; max-width: 10ch; text-wrap: balance; }
  p { font-size: clamp(1.1rem, 1.7vw, 1.8rem); line-height: 1.3; max-width: 40ch; margin: 5vh 0 6vh; text-wrap: pretty; }
  .cta { display: flex; justify-content: center; align-items: baseline; gap: 2rem; flex-wrap: wrap; font-weight: 700; font-size: clamp(.9rem, 1.05vw, 1.1rem); text-transform: uppercase; letter-spacing: .02em; }
  .cta a { border-bottom: 3px solid var(--ink); padding-bottom: .15em; }
  .cta a.primary { background: var(--lichen); border: 0; padding: .55em .9em; }
  .cta a:hover { border-bottom-color: var(--xanth); }
  .cta a.primary:hover { background: var(--ink); color: var(--ground); }
  @media (max-width: 820px) {
    :root { --pad: 5vw; }
    .cta { flex-direction: column; align-items: center; gap: 1.4rem; }   /* baseline would left-align a column */
  }
  @media (hover: none) {
    .cta a:hover { border-bottom-color: var(--ink); } .cta a.primary:hover { background: var(--lichen); color: var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="logo" href="/woodwork/" aria-label="TEM Design home"><img src="/woodwork/logo/logo-128.png" srcset="/woodwork/logo/logo-128.png 1x, /woodwork/logo/logo-256.png 2x" width="128" height="128" alt=""></a>
  <h1>This page has moved</h1>
  <p>Have a look through the gallery instead.</p>
  <div class="cta">
    <a class="primary" href="/woodwork/#work">Browse the gallery</a>
    <a href="/woodwork/">Back to home</a>
  </div>
</main>
</body>
</html>
